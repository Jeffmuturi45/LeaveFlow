{% extends 'base.html' %}
{% block title %}{{ action }} Employee{% endblock %}
{% block content %}
<div class="page-header fade-in">
    <div><h1 class="page-title">{{ action }} Employee</h1></div>
    <a href="/employees/" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-8">
<div class="card fade-in fade-in-1">
    <div class="card-header"><h6 class="card-title">Employee Information</h6></div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">First Name *</label><input name="first_name" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Last Name *</label><input name="last_name" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Username *</label><input name="username" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Password *</label><input type="password" name="password" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Employee Number *</label><input name="employee_number" class="form-control" required placeholder="EMP001"></div>
                <div class="col-md-6"><label class="form-label">National ID *</label><input name="national_id" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">Department</label>
                    <select name="department" class="form-select"><option value="">-- None --</option>{% for d in departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select>
                </div>
                <div class="col-md-6"><label class="form-label">Position *</label><input name="position" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Employment Date *</label><input type="date" name="employment_date" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Profile Photo</label><input type="file" name="profile_photo" class="form-control" accept="image/*"></div>
            </div>
            <div class="divider"></div>
            <div class="d-flex gap-2 justify-content-end">
                <a href="/employees/" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Save Employee</button>
            </div>
        </form>
    </div>
</div>
</div></div>
{% endblock %}
