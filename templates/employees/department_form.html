{% extends 'base.html' %}
{% block title %}{{ action }} Department{% endblock %}
{% block content %}
<div class="page-header fade-in">
    <div><h1 class="page-title">{{ action }} Department</h1></div>
    <a href="/employees/departments/" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-6">
<div class="card fade-in fade-in-1">
    <div class="card-header"><h6 class="card-title">Department Information</h6></div>
    <div class="card-body">
        <form method="post">{% csrf_token %}
            <div class="mb-3"><label class="form-label">Department Name *</label><input name="name" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div>
            <div class="mb-3"><label class="form-label">Department Manager</label>
                <select name="manager" class="form-select"><option value="">-- None --</option>{% for m in managers %}<option value="{{ m.id }}">{{ m.get_full_name }}</option>{% endfor %}</select>
            </div>
            <div class="divider"></div>
            <div class="d-flex gap-2 justify-content-end">
                <a href="/employees/departments/" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Save</button>
            </div>
        </form>
    </div>
</div>
</div></div>
{% endblock %}
